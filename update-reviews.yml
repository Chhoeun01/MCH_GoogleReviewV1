name: Update Review Dashboard Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update reviews JSON
        run: node scripts/update-reviews.js

      - name: Commit changed data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/reviews.json
          git commit -m "Update review dashboard data" || exit 0
          git push
